# OPTIONAL PAID alternative. Do not sync until backup, approval of cost and restore.
# Select THIS path in Render instead of render.yaml; never manage both together.
services:
  - type: web
    name: e-pautas
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    plan: 0.5c-512mb
    autoDeployTrigger: "off"
    disk:
      name: epautas-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://e-pautas.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/data/database.sqlite
      # Explicitly clear any PostgreSQL URL left on the service.
      - key: DB_URL
        value: ""
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
