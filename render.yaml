# PostgreSQL is provisioned/selected separately. This file creates no database or disk.
# Existing production: back up BEFORE syncing or deploying. See docs/ARMAZENAMENTO.md.
services:
  - type: web
    name: e-pautas
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Preserve the CURRENT production key; do not generate a new one on migration.
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://e-pautas.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      # Laravel reads DB_URL (not DATABASE_URL). Use Render's Internal Database URL.
      - key: DB_URL
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
